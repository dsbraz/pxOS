[project]
name = "pxos"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pxos-kernel", "brq-at-work"]

[tool.uv]
package = false

[tool.uv.sources]
pxos-kernel = { workspace = true }
brq-at-work = { workspace = true }

[tool.uv.workspace]
members = ["pxos-kernel", "brq-at-work"]
exclude = ["spikes/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes", "**/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pxos_kernel", "brq_at_work"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pxos-kernel/src", "pxos-kernel/tests", "brq-at-work/src"]
mypy_path = ["pxos-kernel/tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["linkml.*", "linkml_runtime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.generated"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["pxos-kernel/tests"]
pythonpath = ["pxos-kernel/tests"]
addopts = ["--import-mode=importlib"]

[tool.importlinter]
root_packages = ["pxos_kernel", "brq_at_work"]

[[tool.importlinter.contracts]]
name = "O kernel não importa a distribuição"
type = "forbidden"
source_modules = ["pxos_kernel"]
forbidden_modules = ["brq_at_work"]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
