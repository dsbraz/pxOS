services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: ontology_governance_spike
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: local-spike-only
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d ontology_governance_spike"]
      interval: 2s
      timeout: 3s
      retries: 30
