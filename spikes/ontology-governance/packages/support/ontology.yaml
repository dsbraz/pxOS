imports:
  - linkml:types
default_range: string
classes:
  Ticket:
    attributes:
      assignee:
        required: true
        pattern: "^.+$"
      priority:
        required: true
        range: Priority
enums:
  Priority:
    permissible_values:
      normal:
      urgent:
