[project]
name = "pxos-graphiti-spike"
version = "0.1.0"
description = "Experimento isolado de memória e ontologia para pxOS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "graphiti-core[google-genai]==0.31.2",
  "httpx==0.28.1",
  "linkml==1.12.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["neo4j: requires the dedicated local spike container"]

[tool.ruff]
line-length = 100
exclude = ["spike/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
