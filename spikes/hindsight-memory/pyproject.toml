[project]
name = "pxos-hindsight-spike"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["hindsight-api-slim==1.2.1", "hindsight-client==1.2.1"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
