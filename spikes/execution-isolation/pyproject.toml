[project]
name = "pxos-execution-isolation-spike"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["asyncpg==0.32.0", "pydantic==2.14.3"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
exclude = ["spike/generated_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
