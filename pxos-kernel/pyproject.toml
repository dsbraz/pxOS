[project]
name = "pxos-kernel"
version = "0.1.0"
description = "Kernel do pxOS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "httpx==0.28.1",
    "asyncpg==0.32.0",
    "linkml==1.12.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
