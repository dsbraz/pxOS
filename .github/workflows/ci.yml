name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: python (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [graphiti-memory, hindsight-memory]
    defaults:
      run:
        working-directory: spikes/${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.7'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --frozen ruff check spike tests
      - run: uv run --frozen ruff format --check spike tests
      - if: matrix.project == 'graphiti-memory'
        run: docker compose up -d --wait
      - run: uv run --frozen pytest -q
        env:
          SPIKE_TEST_NEO4J: '1'
          GRAPHITI_TELEMETRY_ENABLED: 'false'
      - if: always() && matrix.project == 'graphiti-memory'
        run: docker compose down --volumes
